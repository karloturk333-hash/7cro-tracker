name: Update 7CRO data

# Povlaci svjeze podatke sa ZSE i commita ih natrag u repo.
# Streamlit Cloud se onda auto-redeploya.

on:
  schedule:
    # 18:00 UTC = 19:00 CET (radnim danom, nakon zatvaranja burze)
    - cron: "0 18 * * 1-5"
  workflow_dispatch:   # omogucava rucno pokretanje iz GitHub UI-ja

permissions:
  contents: write       # da workflow smije commitati

concurrency:
  group: update-zse-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pandas>=2,<3" "requests>=2.31"

      - name: Fetch latest 7CRO and CROBEX10tr data
        run: |
          python scripts/fetch_zse.py
          python scripts/fetch_zse_index.py

      - name: Validate market data
        run: python scripts/validate_market_data.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/sample/)" ]; then
            LATEST=$(awk -F';' 'NR == 2 { print $4; exit }' data/sample/7cro_zse.csv)
            git add data/sample/7cro_zse.csv data/sample/crobex10tr_zse.csv
            git commit -m "chore: auto-update ZSE data ($(date +%Y-%m-%d), latest $LATEST)"
            git push
            echo "Pushano. Zadnji datum 7CRO CSV-a: $LATEST"
          else
            echo "Nema promjena u podacima."
          fi
